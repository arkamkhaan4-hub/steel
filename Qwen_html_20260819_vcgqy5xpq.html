<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYDRA | Premium Steel Water Bottle</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --text-primary: #ffffff;
            --text-secondary: #a0a5b0;
            --accent-color: #00e5ff;
            --bottle-color: #2c3e50;
            --bottle-highlight: #4ca1af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            background: rgba(15, 17, 21, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--accent-color);
            color: var(--bg-color);
            font-size: 0.7rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cart-count.bump {
            transform: scale(1.4);
        }

        /* --- HERO SECTION --- */
        .hero {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 100px 5% 50px;
            gap: 4rem;
        }

        /* Pure CSS Bottle Graphic */
        .product-display {
            position: relative;
            width: 300px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bottle-glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--accent-color);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
            z-index: 0;
        }

        .bottle {
            position: relative;
            width: 120px;
            height: 320px;
            background: linear-gradient(90deg, var(--bottle-color) 0%, var(--bottle-highlight) 50%, var(--bottle-color) 100%);
            border-radius: 20px 20px 40px 40px;
            box-shadow: 
                inset -10px 0 20px rgba(0,0,0,0.3),
                inset 10px 0 20px rgba(255,255,255,0.1),
                0 20px 50px rgba(0,0,0,0.5);
            z-index: 1;
            transition: background 0.5s ease;
        }

        .bottle-cap {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: #111;
            border-radius: 10px 10px 5px 5px;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5);
        }
        
        .bottle-cap::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background: #222;
            border-radius: 5px 5px 0 0;
        }

        .bottle-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Product Info */
        .product-info {
            max-width: 500px;
            z-index: 2;
        }

        .product-info h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            background: linear-to-right, #fff, #a0a5b0;
        }

        .tagline {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .description {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .price {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }

        /* Options (Colors & Sizes) */
        .options-group {
            margin-bottom: 2rem;
        }

        .options-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .color-swatches {
            display: flex;
            gap: 15px;
        }

        .swatch {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .swatch.active {
            border-color: var(--accent-color);
            transform: scale(1.1);
        }

        .swatch:hover {
            transform: scale(1.1);
        }

        .sizes {
            display: flex;
            gap: 10px;
        }

        .size-btn {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .size-btn.active, .size-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        /* Buttons */
        .btn-primary {
            padding: 15px 40px;
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 229, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        /* --- FEATURES SECTION --- */
        .features {
            padding: 80px 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .feature-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .feature-card h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .feature-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
